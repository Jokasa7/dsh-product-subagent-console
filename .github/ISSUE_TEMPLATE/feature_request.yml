name: Feature request
description: Suggest an improvement to Live, Plan, Deviation, Recovery, or setup
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What multi-Agent workflow or problem are you trying to handle?
    validations:
      required: true
  - type: textarea
    id: current-workflow
    attributes:
      label: Current workflow
      description: How do you handle it today, and where does that workflow break down?
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than a specific implementation when possible.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Relevant versions
      placeholder: Plugin 0.9.0, DSH 0.1.1-rc.2
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing Issues for a similar request.
          required: true
        - label: This request does not contain credentials or private task content.
          required: true
