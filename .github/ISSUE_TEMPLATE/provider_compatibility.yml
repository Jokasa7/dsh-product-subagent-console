name: Provider compatibility report
description: Report a verified Provider and lifecycle compatibility result
title: "[Provider] "
labels: ["provider-compatibility", "triage"]
body:
  - type: markdown
    attributes:
      value: Report only a controlled, sanitized compatibility result. Never include credentials, authentication configuration, private prompts, model output, or real task data.
  - type: dropdown
    id: outcome
    attributes:
      label: Result
      options:
        - Works as expected
        - Partially works
        - Delegation fails
        - Lifecycle is incomplete or inaccurate
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider name
      placeholder: Codex
    validations:
      required: true
  - type: input
    id: bundle
    attributes:
      label: Provider Bundle ID and version
      placeholder: package-name 0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin, DSH, and Node.js versions
      placeholder: Plugin 0.9.0, DSH 0.1.1-rc.2, Node.js 22.19.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Surface and environment
      placeholder: Windows Desktop, Windows 11, Chrome
    validations:
      required: true
  - type: dropdown
    id: delegation-path
    attributes:
      label: Delegation path
      options:
        - Native child delegation
        - Product Subagent Console Workflow
        - External coding Provider
        - More than one path
    validations:
      required: true
  - type: textarea
    id: controlled-task
    attributes:
      label: Controlled test summary
      description: Describe the test generically. Do not paste the original prompt or output.
      placeholder: Two read-only tasks inspected public project metadata and a third task summarized their declared results.
    validations:
      required: true
  - type: checkboxes
    id: observed-capabilities
    attributes:
      label: Observed capabilities
      options:
        - label: Child Session was published and visible.
        - label: Parent-child ownership was correct.
        - label: Starting, running, and terminal transitions were visible.
        - label: The native child conversation could be opened.
        - label: Approved tasks mapped to actual attempts.
  - type: textarea
    id: lifecycle-result
    attributes:
      label: Expected and actual lifecycle result
      description: Explain missing, delayed, or inaccurate states without including identifiers or private output.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional. Drag only reviewed screenshots or minimal logs with identifiers and private content removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I used a controlled test and checked the result myself.
          required: true
        - label: I removed credentials, authentication details, identifiers, prompts, output, paths, and private task content.
          required: true
