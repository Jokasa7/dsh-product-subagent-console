name: Run Capsule report
description: Share a reviewed Run Capsule manifest for diagnosis or compatibility evidence
title: "[Run Capsule] "
labels: ["run-capsule", "triage"]
body:
  - type: markdown
    attributes:
      value: A Run Capsule is evidence, not a request to publish private work. Review every field before submission. Do not attach the full ZIP when a sanitized manifest is sufficient.
  - type: dropdown
    id: purpose
    attributes:
      label: Purpose
      options:
        - Reproduce a bug
        - Provider compatibility
        - Deviation analysis
        - Recovery analysis
        - Recipe candidate feedback
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin, DSH, and Capsule schema versions
      placeholder: Plugin 0.9.0, DSH 0.1.1-rc.2, Capsule schema 1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Provider and surface
      placeholder: Codex Provider, Windows Desktop
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should this Capsule help explain?
      description: Describe the problem without copying the original objective, task brief, prompt, or model output.
    validations:
      required: true
  - type: input
    id: manifest-digest
    attributes:
      label: Manifest digest
      description: Copy the digest from the exported manifest after your review.
    validations:
      required: true
  - type: dropdown
    id: text-content
    attributes:
      label: Objective or task brief text included?
      options:
        - No
        - Yes, reviewed and intentionally included
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Sanitized manifest or attachment
      description: Paste the smallest relevant excerpt, or drag the reviewed manifest JSON here. Do not upload opaque archives or unreviewed exports.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I exported this Capsule from Product Subagent Console and disclosed any manual changes.
          required: true
        - label: I manually inspected every submitted field and attachment.
          required: true
        - label: I removed credentials, authentication details, prompts, model output, local paths, native logs, and private task content.
          required: true
        - label: I understand that this Issue and its attachments are public.
          required: true
