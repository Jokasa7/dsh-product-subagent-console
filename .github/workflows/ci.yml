name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE_EXCLUDE: '@deepseek-ai/*'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: windows-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and build distribution
        run: pnpm run build

      - name: Check tracked public tree and whitespace
        shell: bash
        run: |
          pnpm run verify:public
          git diff --check

      - name: Verify publishable tarball inventory
        run: pnpm run pack:check

      - name: Install Chromium headless shell
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Smoke packed plugin in a clean DSH Web profile
        if: runner.os == 'Linux'
        run: pnpm run smoke:web

      - name: Check package metadata
        run: pnpm publint
