name: GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE_EXCLUDE: '@deepseek-ai/*'

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" ]]; then
            echo "Checked-out commit does not match tag ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          pnpm run pack:check
          pnpm run publint
          git diff --check

      - name: Pack prebuilt bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          pnpm pack --pack-destination release --config.ignore-scripts=true
          count="$(find release -maxdepth 1 -type f -name '*.tgz' | wc -l)"
          if [[ "${count}" -ne 1 ]]; then
            echo "Expected one tarball, found ${count}." >&2
            exit 1
          fi

      - name: Prepare reviewed release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          VERSION="${version}" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const version = process.env.VERSION
          const changelog = readFileSync('CHANGELOG.md', 'utf8')
          const startMarker = `## [${version}]`
          const start = changelog.indexOf(startMarker)
          if (start < 0) throw new Error(`CHANGELOG.md has no ${startMarker} section`)
          const next = changelog.indexOf('\n## [', start + startMarker.length)
          const notes = changelog.slice(start, next < 0 ? changelog.length : next).trim()
          if (notes.length < 80) throw new Error(`release notes for ${version} are unexpectedly short`)
          writeFileSync('release/RELEASE_NOTES.md', `${notes}\n`)
          NODE

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Smoke the exact release package in a clean DSH Web profile
        shell: bash
        run: |
          set -euo pipefail
          package="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "${package}"
          pnpm run smoke:web -- --package "${package}"

      - name: Create and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum ./*.tgz > SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Preserve release assets as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-product-subagent-console-${{ github.ref_name }}
          path: |
            release/*.tgz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attest release package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release_flags=(--verify-tag --draft)
          if [[ "${version}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tgz \
            release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "dsh-product-subagent-console ${GITHUB_REF_NAME}" \
            --notes-file release/RELEASE_NOTES.md \
            "${release_flags[@]}"
